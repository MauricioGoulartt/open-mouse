name: macOS
on:
  push:
    branches: [main, 'codex/**']
    paths: ['Package.swift', 'Sources/**', 'Tests/**', 'Resources/**', 'LICENSE', 'LICENSES/**', 'THIRD_PARTY_NOTICES.md', 'scripts/package-app.sh', '.github/workflows/macos.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Guard native checker exit status through output pipelines
        run: |
          if (exit 17) | tee /dev/null; then
            echo '::error::A failed native checker was masked by its output pipeline'
            exit 1
          fi
      - name: Runtime and executor
        run: |
          sw_vers
          uname -m
          swift --version
          printf 'sha=%s\nrunner=%s\n' "$GITHUB_SHA" "$RUNNER_NAME"
      - name: Contract and regression tests
        run: swift test --jobs 2
      - name: Release build
        run: swift build -c release --jobs 2
      - name: Package app
        run: bash scripts/package-app.sh --skip-build
      - name: Non-intercepting diagnostics
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --diagnose | tee dist/diagnostics.json'
      - name: Native event protocol checks without posting
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --check-native-events | tee dist/native-event-checks.txt'
      - name: Real input pipeline on the isolated hosted desktop
        env:
          OPEN_MOUSE_ISOLATED_TEST: '1'
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --integration-check | tee dist/input-integration-checks.txt'
      - name: Verify visible system gestures on the isolated desktop
        env:
          OPEN_MOUSE_ISOLATED_TEST: '1'
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --system-gesture-check | tee dist/system-gesture-checks.json'
      - name: Render native settings without displaying a window
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --render-preview "$PWD/dist/previews"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: OpenMouse-macOS
          path: |
            dist/OpenMouse-macOS.zip
            dist/diagnostics.json
            dist/native-event-checks.txt
            dist/input-integration-checks.txt
            dist/system-gesture-checks.json
            dist/system-probe/
            dist/previews/
          retention-days: 14
