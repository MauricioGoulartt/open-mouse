name: macOS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Runtime and executor
        run: |
          sw_vers
          uname -m
          swift --version
          printf 'sha=%s\nrunner=%s\n' "$GITHUB_SHA" "$RUNNER_NAME"
      - name: Contract and regression tests
        run: swift test --jobs 2
      - name: Release build
        run: swift build -c release --jobs 2
      - name: Package app
        run: bash scripts/package-app.sh --skip-build
      - name: Non-intercepting diagnostics
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --diagnose | tee dist/diagnostics.json'
      - name: Native event protocol checks without posting
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --check-native-events | tee dist/native-event-checks.txt'
      - name: Render native settings without displaying a window
        run: '"dist/Open Mouse.app/Contents/MacOS/OpenMouse" --render-preview "$PWD/dist/previews"'
      - uses: actions/upload-artifact@v7
        with:
          name: OpenMouse-macOS
          path: |
            dist/OpenMouse-macOS.zip
            dist/diagnostics.json
            dist/native-event-checks.txt
            dist/previews/
          retention-days: 14
